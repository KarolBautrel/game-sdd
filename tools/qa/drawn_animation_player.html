<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pracownia postaci · animacje</title>
<style>
:root{color-scheme:dark;--bg:#13191b;--panel:#20282b;--line:#3c484a;--gold:#d6b473;--text:#ece6d9;--muted:#a8b5b6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif}button,select,input{font:inherit}button,select{background:#293437;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px 13px}button{cursor:pointer}button:hover,button.active{border-color:var(--gold);color:var(--gold)}header{padding:22px 30px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:24px;margin:0;color:var(--gold)}header p{margin:0;color:var(--muted);font-size:14px}main{max-width:1500px;margin:auto;padding:24px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px}aside,section{min-width:0}.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:18px;margin-bottom:18px}label{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}.actions{display:grid;gap:8px}.actions button{text-align:left;font-size:14px}h2{font-size:20px;margin:0 0 5px;color:var(--gold)}.small{color:var(--muted);font-size:13px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:15px 0}.toolbar label{margin:0}.stage-wrap{overflow:auto;border-radius:8px;background:#151b1d;border:1px solid var(--line)}canvas{display:block;image-rendering:pixelated}.native{display:flex;gap:15px;align-items:start;flex-wrap:wrap;margin-top:18px}.native canvas{border-radius:8px;border:1px solid var(--line)}.info{padding:10px 0;color:var(--muted);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--gold)}.error{color:#ffb0a6;white-space:pre-wrap}.badge{display:inline-block;padding:4px 9px;border:1px solid var(--line);border-radius:20px;color:var(--muted);font-size:12px;margin-top:8px}@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}.actions{grid-template-columns:repeat(2,1fr)}header{padding:18px}.native canvas{max-width:100%;height:auto}}
</style>
<header><div><h1>Pracownia postaci</h1><p>Animacje w skali planszy i w powiększeniu</p></div><select id="profile" aria-label="Postać"></select><select id="direction" aria-label="Kierunek"></select><span class="badge" id="view"></span></header>
<main><aside><div class="panel"><label>Animacja</label><div id="actions" class="actions"></div></div><div class="panel"><button id="tour">Pokaż cały zestaw</button><p class="small">Każda animacja odtworzy się w normalnym tempie. Akcje jednorazowe kończą się na ostatniej klatce.</p><label><input type="checkbox" id="repeat"> Powtarzaj także pojedyncze akcje</label><label><input type="checkbox" id="track" checked> Ruch podłoża podczas chodu</label></div></aside>
<section><div class="panel"><h2 id="title"></h2><div class="small" id="subtitle"></div><div class="toolbar"><button id="play">Pauza</button><button id="previous" title="Poprzednia klatka">◀ Klatka</button><button id="next" title="Następna klatka">Klatka ▶</button><button id="restart">Od początku</button><select id="speed" aria-label="Prędkość"><option value=".5">0,5×</option><option value="1" selected>1× · normalnie</option><option value="1.5">1,5×</option></select><select id="zoom" aria-label="Powiększenie"><option value="1">Skala 1×</option><option value="2" selected>Powiększenie 2×</option><option value="3">Powiększenie 3×</option></select><select id="ground" aria-label="Podłoże"><option value="woodland">Las</option><option value="earth">Ziemia</option><option value="cave">Jaskinia</option><option value="plain">Gładkie tło</option></select></div><div class="stage-wrap"><canvas id="stage" width="768" height="640"></canvas></div><div class="info" id="info">Ładowanie…</div><input id="timeline" type="range" min="0" max="1" value="0" step="1" aria-label="Klatka animacji"><div id="error" class="error"></div></div>
<div class="panel native"><div><label>Zawsze skala planszy 1×</label><canvas id="native" width="384" height="320"></canvas></div><p class="small" id="note">Oceń stopy, chwyt, sylwetkę i powrót do gotowości. Spacja: pauza, strzałki: pojedyncze klatki.</p></div></section></main>
<script id="review-data" type="application/json">__DRAWN_ANIMATION_DATA__</script>
<script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('review-data').textContent),$=id=>document.getElementById(id);
const images=new Map(),grounds=new Map();let profileIndex=0,viewIndex=0,clipIndex=1,frame=0,phase=0,elapsed=0,playing=true,zoom=2,speed=1,tour=false,tourWait=0,tourLoops=0,last=0,loaded=false;
const baseProfile=()=>data.profiles[profileIndex],profile=()=>({...baseProfile(),...baseProfile().views[viewIndex]}),clip=()=>profile().clips[clipIndex],ctx=$('stage').getContext('2d'),native=$('native').getContext('2d');
function report(message){$('error').textContent+=message+'\n';}
function load(src){if(images.has(src))return images.get(src);const im=new Image();im.src=src;im.onerror=()=>report('Nie można wczytać: '+src);images.set(src,im);return im;}
const viewLabel=()=>profile().label;
for(const kind of ['woodland','earth','cave'])grounds.set(kind,load(data.ground_base+kind+'.png'));
const shadow=load(data.shadow);
function choose(index){clipIndex=index;frame=0;phase=0;elapsed=0;tourWait=0;tourLoops=0;playing=true;sync();}
function sync(){const p=profile(),c=clip();$('title').textContent=c.title;$('subtitle').textContent=p.title+' · '+viewLabel()+' · '+(c.mode==='neutral'?'wariant neutralny':c.mode==='combat'?'wariant bojowy':'zmiana gotowości');$('view').textContent=p.exported_views.length+' / 8 kierunków';$('play').textContent=playing?'Pauza':'Odtwarzaj';$('note').textContent=(p.direction_note?p.direction_note+' ':'')+'Oceń stopy, chwyt, sylwetkę i powrót do gotowości. Spacja: pauza, strzałki: pojedyncze klatki.';$('timeline').max=c.frames-1;$('timeline').value=frame;for(const b of $('actions').children)b.classList.toggle('active',Number(b.dataset.index)===clipIndex);$('tour').textContent=tour?'Zakończ pokaz':'Pokaż cały zestaw';}
function build(preferred){const p=profile();images.clear();loaded=false;$('error').textContent='';for(const c of p.clips)load(p.asset_base+c.atlas);$('actions').replaceChildren();p.clips.forEach((c,index)=>{const b=document.createElement('button');b.textContent=c.title;b.dataset.index=index;b.onclick=()=>{tour=false;choose(index);};$('actions').append(b);});if(preferred){const fallback={attack_alt:'attack',block:'combat_idle',dodge:'combat_idle',draw:'combat_idle',sheathe:'neutral_idle'};let i=p.clips.findIndex(c=>c.id===preferred);if(i<0)i=p.clips.findIndex(c=>c.id===(fallback[preferred]||'neutral_idle'));clipIndex=Math.max(0,i);}else clipIndex=Math.min(clipIndex,p.clips.length-1);choose(clipIndex);}
data.profiles.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.title;$('profile').append(o);});$('profile').onchange=e=>{const preferred=clip().id,facing=profile().id;profileIndex=Number(e.target.value);viewIndex=Math.max(0,baseProfile().views.findIndex(v=>v.id===facing));tour=false;buildViews(preferred);};
function buildViews(preferred){$('direction').replaceChildren();baseProfile().views.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.label;$('direction').append(o);});$('direction').value=viewIndex;build(preferred);}
$('direction').onchange=e=>{const preferred=clip().id;viewIndex=Number(e.target.value);tour=false;build(preferred);};
function duration(){return clip().durations[frame];}
function tick(dt){if(!playing)return;const c=clip();elapsed+=dt;phase+=dt;
 if(tourWait>0){tourWait-=dt;if(tourWait<=0)choose((clipIndex+1)%profile().clips.length);return;}
 let guard=0;while(phase>=duration()&&guard++<30){phase-=duration();if(frame<c.frames-1)frame++;else if(c.loop||$('repeat').checked){frame=0;tourLoops++;if(tour&&tourLoops>=2){tourWait=500;phase=0;break;}}else if(tour){tourWait=c.id==='death'?1500:650;phase=0;break;}else{playing=false;phase=0;break;}}
 $('timeline').value=frame;$('play').textContent=playing?'Pauza':'Odtwarzaj';}
function render(context,z){const p=profile(),c=clip(),w=p.canvas[0],h=p.canvas[1];context.canvas.width=w*z;context.canvas.height=h*z;context.imageSmoothingEnabled=false;context.setTransform(z,0,0,z,0,0);context.fillStyle='#252b2c';context.fillRect(0,0,w,h);
 const g=grounds.get($('ground').value),walking=c.id.includes('walk'),total=c.durations.reduce((a,b)=>a+b,0),travel=walking&&$('track').checked?elapsed/total*(p.walk_stride_pixels||80):0;
 if(g&&g.complete&&g.naturalWidth){const axis={south:[0,1],south_west:[-.707,.707],west:[-1,0],north_west:[-.707,-.707],north:[0,-1],north_east:[.707,-.707],east:[1,0],south_east:[.707,.707]}[p.id]||[1,0];const gx=(((-travel*axis[0])%512)+512)%512-512,gy=(((-travel*axis[1])%512)+512)%512-512;for(let y=gy;y<h;y+=512)for(let x=gx;x<w;x+=512)context.drawImage(g,x,y);context.fillStyle='rgba(0,0,0,.12)';context.fillRect(0,0,w,h);}
 const px=p.pivot[0],py=p.pivot[1];if(shadow.complete&&shadow.naturalWidth)context.drawImage(shadow,px-45,py-11,90,26);
 const image=images.get(p.asset_base+c.atlas);if(image&&image.complete&&image.naturalWidth)context.drawImage(image,frame*w,0,w,h,0,0,w,h);
 context.fillStyle='rgba(230,210,170,.35)';context.fillRect(px-2,py+3,4,1);}
function draw(now){const dt=last?Math.min(now-last,200)*speed:0;last=now;loaded=[...images.values()].every(im=>im.complete&&im.naturalWidth>0);if(loaded)tick(dt);render(ctx,zoom);render(native,1);const c=clip();$('info').textContent='Klatka '+(frame+1)+' / '+c.frames+' · '+(c.durations.reduce((a,b)=>a+b,0)/1000).toFixed(2)+' s · '+speed+'×'+(loaded?'':' · ładowanie obrazów');loaded=[...images.values()].every(im=>im.complete&&im.naturalWidth>0);requestAnimationFrame(draw);}
function step(delta){playing=false;tour=false;phase=0;frame=(frame+delta+clip().frames)%clip().frames;sync();}
$('play').onclick=()=>{playing=!playing;last=0;sync();};$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('restart').onclick=()=>choose(clipIndex);$('timeline').oninput=e=>{playing=false;tour=false;frame=Number(e.target.value);phase=0;sync();};$('speed').onchange=e=>{speed=Number(e.target.value);last=0;};$('zoom').onchange=e=>zoom=Number(e.target.value);$('tour').onclick=()=>{tour=!tour;if(tour)choose(0);sync();};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').click();}if(e.code==='ArrowRight'){e.preventDefault();step(1);}if(e.code==='ArrowLeft'){e.preventDefault();step(-1);}});
window.animationReview={state:()=>({profile:baseProfile().id,view:profile().id,clip:clip().id,frame,playing,tour,loaded,errors:$('error').textContent}),select:id=>{const index=profile().clips.findIndex(c=>c.id===id);if(index<0)throw Error(id);choose(index);},step,advance:tick};
buildViews();requestAnimationFrame(draw);
})();
</script></html>
