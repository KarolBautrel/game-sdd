<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poprawki postaci — przed i po</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151c1e;color:#eee6d7;font:16px/1.5 system-ui,Segoe UI,sans-serif}header,main{max-width:1660px;margin:auto;padding:20px}h1{font-size:25px;color:#dab97c;margin:0 0 10px}p{margin:8px 0;color:#b4c0bc}nav,.controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}button,select{font:inherit;color:inherit;background:#293436;border:1px solid #52635e;border-radius:6px;padding:9px 13px;cursor:pointer}button.active{border-color:#e2bd77;color:#e2bd77}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}article{background:#202a2c;padding:14px;border-radius:8px}h2{font-size:20px;margin:0 0 8px}canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated}small{color:#b4c0bc}.native{margin-top:12px;border:1px solid #4a5753}#error{color:#ffaaa0}@media(max-width:850px){.cards{grid-template-columns:1fr}}
</style>
<header><h1>Poprawki postaci · przed i po</h1><p>Wybierz poprawkę i widok. Po lewej poprzednia wersja, po prawej nowa. Pod powiększeniem jest skala planszy 1×.</p><nav id="topics"></nav><select id="sample" aria-label="Postać, kierunek i animacja"></select><div class="controls"><button id="play">Pauza</button><button id="restart">Od początku</button><button id="previous">Klatka wstecz</button><button id="next">Klatka dalej</button><select id="speed" aria-label="Prędkość"><option value="1">1× — normalnie</option><option value="0.5">0,5×</option></select></div><p id="note"></p><p id="error"></p></header>
<main><div class="cards"><article><h2>Przed</h2><canvas id="old" width="768" height="640"></canvas><small id="old-info"></small><canvas class="native" id="old-native" width="384" height="320"></canvas></article><article><h2>Po poprawce</h2><canvas id="new" width="768" height="640"></canvas><small id="new-info"></small><canvas class="native" id="new-native" width="384" height="320"></canvas></article></div></main>
<script id="refinement-data" type="application/json">__REFINEMENT_DATA__</script>
<script>
(()=>{
 const data=JSON.parse(document.getElementById('refinement-data').textContent),$=id=>document.getElementById(id),cache=new Map();
 let topic='idle',cases=[],selected=0,playing=true,speed=1,last=0,clocks=[0,0];
 function load(path){if(!cache.has(path)){const im=new Image();im.onerror=()=>$('error').textContent='Nie można otworzyć obrazu: '+path;im.src=path;cache.set(path,im);}return cache.get(path);}
 const floor=load(data.floor),shadow=load(data.shadow);
 function sample(){return cases[selected];}
 function total(clip){return clip.durations.reduce((a,b)=>a+b,0);}
 function frameAt(clip,t){let phase=t%(total(clip)+(clip.loop?0:800));for(let f=0;f<clip.frames;f++){if(phase<clip.durations[f])return f;phase-=clip.durations[f];}return clip.frames-1;}
 function sync(){$('play').textContent=playing?'Pauza':'Odtwarzaj';}
 function choose(index){selected=index;clocks=[0,0];last=0;playing=true;$('sample').value=index;$('note').textContent=sample().note;$('error').textContent='';cache.clear();load(sample().old.atlas);load(sample().new.atlas);sync();}
 function chooseTopic(value){topic=value;cases=data.cases.filter(c=>c.topic===topic);$('sample').replaceChildren();cases.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.label;$('sample').append(o);});for(const b of $('topics').children)b.classList.toggle('active',b.dataset.topic===value);choose(0);}
 for(const [id,title] of [['idle','Spoczynek'],['shield','Tarcza od środka'],['bow','Łuk: naciąg i celowanie']]){const b=document.createElement('button');b.textContent=title;b.dataset.topic=id;b.onclick=()=>chooseTopic(id);$('topics').append(b);}
 function render(id,entry,t,z){const canvas=$(id),ctx=canvas.getContext('2d'),frame=frameAt(entry,t);ctx.setTransform(z,0,0,z,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#30372e';ctx.fillRect(0,0,384,320);if(floor.complete&&floor.naturalWidth)ctx.drawImage(floor,0,0);if(shadow.complete&&shadow.naturalWidth)ctx.drawImage(shadow,147,259,90,26);const im=load(entry.atlas);if(im.complete&&im.naturalWidth)ctx.drawImage(im,frame*384,0,384,320,0,0,384,320);ctx.fillStyle='rgba(242,216,151,.4)';ctx.fillRect(145,274,94,1);return frame;}
 function draw(now){const dt=last?Math.min(100,now-last)*speed:0;last=now;const c=sample();if(playing&&[c.old,c.new].every(e=>load(e.atlas).complete&&load(e.atlas).naturalWidth))clocks=clocks.map(t=>t+dt);for(const [i,key] of ['old','new'].entries()){const f=render(key,c[key],clocks[i],2);render(key+'-native',c[key],clocks[i],1);$(key+'-info').textContent='Klatka '+(f+1)+' / '+c[key].frames+' · '+(total(c[key])/1000).toFixed(2)+' s · '+speed+'×';}requestAnimationFrame(draw);}
 function step(delta){playing=false;const c=sample();['old','new'].forEach((key,i)=>{const clip=c[key],f=(frameAt(clip,clocks[i])+delta+clip.frames)%clip.frames;clocks[i]=clip.durations.slice(0,f).reduce((a,b)=>a+b,0);});sync();}
 $('sample').onchange=e=>choose(Number(e.target.value));$('play').onclick=()=>{playing=!playing;last=0;sync();};$('restart').onclick=()=>choose(selected);$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('speed').onchange=e=>speed=Number(e.target.value);
 window.refinementReview={chooseTopic,choose,step,state:()=>({topic,selected,playing,clocks})};chooseTopic('idle');requestAnimationFrame(draw);
})();
</script></html>
