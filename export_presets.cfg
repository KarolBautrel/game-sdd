[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="resources/**/*.json,assets/**/*.json,resources/licenses/*.txt,assets/ui/fonts/*-OFL.txt"
exclude_filter="artifacts/*,builds/*,exports/*,docs/*,tools/*,tests/*,assets_src/*,addons/theme_gen/*,addons/theme_gen_save_sync/*,addons/campaign_ui_theme/*,assets/combat/characters/heroes/*,assets/combat/characters/npc/*,assets/combat/characters/villains/*,assets/combat/characters/processed_character_sheets_manifest.json,override.cfg"
export_path="exports/windows/sdd-game.exe"
encryption_include_filters=""
