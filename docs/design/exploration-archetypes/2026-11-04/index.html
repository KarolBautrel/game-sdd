<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archetypy eksploracji — Ashen Cartographer</title>
<style>
:root{color-scheme:dark;font:16px/1.5 "Segoe UI",sans-serif;color:#e8e0d3;background:#101213}
*{box-sizing:border-box}body{margin:0}main{max-width:1420px;margin:auto;padding:24px}
header{margin-bottom:22px}h1{font-family:Georgia,serif;font-weight:400;font-size:30px;margin:0 0 6px}
p{margin:0;color:#b9b4ab}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
figure{margin:0;background:#191b1c;border:1px solid #45423d}a{display:block;color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid #d9b778;outline-offset:5px}a:hover img{filter:brightness(1.04)}
img{display:block;width:100%;height:auto;aspect-ratio:1672/941;object-fit:contain}
figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 14px}
figcaption strong{font-weight:600}figcaption span{color:#bbb4a6;font-size:14px}.note{margin-top:20px;font-size:14px}
@media(max-width:800px){main{padding:16px}.grid{grid-template-columns:1fr}h1{font-size:25px}figcaption{flex-wrap:wrap}}
</style>
<main>
 <header>
  <h1>Archetypy eksploracji</h1>
  <p>Jeden styl dark fantasy, cztery środowiska. Kliknij próbkę, aby otworzyć pełny rozmiar.</p>
 </header>
 <section class="grid" aria-label="Próbki środowisk">
  <figure><a href="mine.png" target="_blank" rel="noopener" aria-label="Otwórz kopalnię w pełnym rozmiarze"><img src="mine.png" alt="Kopalnia Old Mine: wyrobiska, belki i tory; zatwierdzony wzorzec stylu"><figcaption><strong>Kopalnia — Old Mine</strong><span>Zatwierdzony wzorzec</span></figcaption></a></figure>
  <figure><a href="dungeon.png" target="_blank" rel="noopener" aria-label="Otwórz lochy w pełnym rozmiarze"><img src="dungeon.png" alt="Lochy Blackbarrow: sklepienia, schody, zalane cele i krypta"><figcaption><strong>Lochy — Blackbarrow</strong><span>Kamień, cele i krypty</span></figcaption></a></figure>
  <figure><a href="castle.png" target="_blank" rel="noopener" aria-label="Otwórz zamek w pełnym rozmiarze"><img src="castle.png" alt="Zamek Ravenkeep: brama, dziedziniec, kaplica, koszary i baszta"><figcaption><strong>Zamek — Ravenkeep</strong><span>Dziedzińce, mury i baszty</span></figcaption></a></figure>
  <figure><a href="forest.png" target="_blank" rel="noopener" aria-label="Otwórz las w pełnym rozmiarze"><img src="forest.png" alt="Las Crowswood: ścieżki wśród drzew, kapliczka, obozowisko i kurhan"><figcaption><strong>Las — Crowswood</strong><span>Korzenie, ścieżki i ruiny</span></figcaption></a></figure>
 </section>
 <p class="note">Próbki wyglądu do oceny przed wdrożeniem. Wspólne ramy, układ, portrety i oznaczenia; własna mapa i symbole dla każdego archetypu.</p>
</main>
</html>
